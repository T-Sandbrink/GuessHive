packages:
  - apps/*
  - packages/*

# Do not install a package version until it has been public for a day, so a
# hijacked release is usually caught before it reaches the lockfile. This also
# applies to security fixes; for a truly urgent one, add that package to
# minimumReleaseAgeExclude in the same PR and remove it again afterwards.
minimumReleaseAge: 1440

# Install scripts stay blocked (pnpm default). Prisma's only download (the
# schema-engine binary) also happens lazily on first CLI use.
ignoredBuiltDependencies:
  - '@prisma/engines'
  - '@scarf/scarf'
  - msgpackr-extract
  - prisma

# Security overrides. Remove each one once the parent ships a fixed version.
overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS, high): @prisma/config 7.10.1 pins effect 3.20.0.
  effect: '>=3.22.1 <4'

# One version range per shared dependency; packages refer to it as "catalog:".
catalog:
  '@types/node': ^26.6.6
  '@vitest/browser-playwright': ^5.1.1
  '@vitest/coverage-v8': ^5.1.1
  eslint: ^10.15.0
  globals: ^17.14.0
  prettier: ^3.10.1
  typescript: ~6.0.3
  typescript-eslint: ^8.73.0
  vite: ^8.3.8
  vitest: ^5.1.1
  zod: ^4.6.7
