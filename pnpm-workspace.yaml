packages:
  - apps/*
  - packages/*

# Do not install a package version until it has been public for a day, so a
# hijacked release is usually caught before it reaches the lockfile.
minimumReleaseAge: 1440

# One version range per shared dependency; packages refer to it as "catalog:".
catalog:
  '@types/node': ^24.19.2
  eslint: ^10.15.0
  globals: ^17.14.0
  prettier: ^3.10.1
  typescript: ~6.0.3
  typescript-eslint: ^8.73.0
  vite: ^8.3.8
  vitest: ^5.1.1
  zod: ^4.6.7
