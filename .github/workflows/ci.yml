name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same images and ports as docker-compose.yml, for the api integration tests (task 1.10).
    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: guesshive
          POSTGRES_PASSWORD: guesshive
          POSTGRES_DB: guesshive_test
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U guesshive -d guesshive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (web component tests)
        run: pnpm --filter @guesshive/web exec playwright install --with-deps chromium

      - name: Format (root and all packages)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E tests (web Playwright, api HTTP)
        run: pnpm test:e2e

      - name: Integration tests (api, Postgres + Redis services)
        run: pnpm test:integration
