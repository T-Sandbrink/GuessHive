<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <!-- Only the origin as referrer, also within the site, so no path or query (tokens, private
         pages) reaches other sites or analytics (ADR 0005; headers follow in task 11.5). -->
    <meta name="referrer" content="strict-origin" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
